# Preset bold - style très visible
[style]
font = "Anton-Bold"
fontsdir = "assets/fonts"
size = 80
primary_color = "&H00FFFFFF"
highlight_color = "&HFFFFFF"
accent_color = "&HFFAA00"
outline_color = "&H000000"
outline_width = 8
margin_v = 120
words_per_line = 4
uppercase = true
pop_animation = true
